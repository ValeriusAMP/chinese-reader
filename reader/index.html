<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文阅读器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0c0d14;
  --surface:     #15161f;
  --surface-2:   #1c1e2b;
  --border:      rgba(255,255,255,0.08);
  --text:        #e8e8f0;
  --text-muted:  #9a9ab2;
  --accent:      #8b7cf6;
  --accent-2:    #6ea8fe;
  --accent-grad: linear-gradient(135deg, #8b7cf6, #6ea8fe);
  --r:           12px;
  --zh: "PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",
        "Microsoft YaHei UI","Microsoft YaHei","STHeiti",
        "WenQuanYi Micro Hei",sans-serif;
  --en: -apple-system,"Segoe UI","Helvetica Neue",sans-serif;
}

html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--zh);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ══ WEEK VIEW ════════════════════════════════════════════ */
#week-view {
  max-width: 660px;
  margin: 0 auto;
  padding: 0 16px 100px;
}

.wk-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 32px 0 16px;
  position: relative;
}
.wk-hdr::before {
  content: '';
  position: absolute;
  top: -24px; left: -40px; right: -40px; height: 130px;
  background: radial-gradient(ellipse at 50% 0%, rgba(139,124,246,0.13) 0%, transparent 70%);
  pointer-events: none;
}
.wk-hdr h1 { font-size: 24px; font-weight: 700; }

.pill {
  background: rgba(139,124,246,0.15);
  color: var(--accent);
  border: 1px solid rgba(139,124,246,0.3);
  font-size: 13px;
  font-weight: 700;
  padding: 4px 13px;
  border-radius: 20px;
  font-family: var(--en);
}

/* Week picker */
.week-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.btn-week {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-family: var(--zh);
  font-size: 13px;
  font-weight: 600;
  padding: 5px 15px;
  cursor: pointer;
  transition: border-color .2s, color .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn-week:hover { border-color: rgba(139,124,246,0.3); color: var(--text); }
.btn-week.active {
  background: rgba(139,124,246,0.15);
  border-color: rgba(139,124,246,0.4);
  color: var(--accent);
}

.day-list { display: flex; flex-direction: column; gap: 10px; }

.day-card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: 0 1px 6px rgba(0,0,0,.35);
  border: 1.5px solid var(--border);
  padding: 15px 16px;
  display: flex;
  align-items: center;
  gap: 13px;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.day-card:hover {
  border-color: rgba(139,124,246,0.28);
  box-shadow: 0 2px 16px rgba(0,0,0,.45);
}
.day-card:active { transform: scale(.98); }
.day-card.done {
  border-color: rgba(139,124,246,0.45);
  background: rgba(139,124,246,0.05);
  box-shadow: 0 0 20px rgba(139,124,246,0.09);
}

.day-num {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(139,124,246,0.12);
  color: var(--accent);
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-family: var(--en);
}
.day-card.done .day-num {
  background: rgba(139,124,246,0.22);
  color: var(--accent);
}

.card-info { flex: 1; min-width: 0; }
.card-title {
  font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

.tag {
  font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 5px;
  background: rgba(139,124,246,0.1);
  color: var(--accent);
  border: 1px solid rgba(139,124,246,0.2);
  font-family: var(--en);
}
.tag.lvl {
  background: rgba(110,168,254,0.1);
  color: var(--accent-2);
  border-color: rgba(110,168,254,0.2);
}
.tag.done {
  background: rgba(139,124,246,0.15);
  color: var(--accent);
  border-color: rgba(139,124,246,0.35);
}

.done-icon { font-size: 18px; color: rgba(255,255,255,0.15); flex-shrink: 0; }
.day-card.done .done-icon { color: var(--accent); }

.wk-foot {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px 20px;
  display: flex; justify-content: center; align-items: center;
  gap: 10px; flex-wrap: wrap;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  pointer-events: none;
}
.wk-foot button { pointer-events: all; }

.btn-export {
  background: var(--accent-grad);
  color: #fff;
  border: none; border-radius: 30px;
  padding: 13px 28px;
  font-size: 15px; font-family: var(--zh); font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 18px rgba(139,124,246,0.38);
  transition: box-shadow .2s, opacity .15s, transform .1s;
}
.btn-export:hover { box-shadow: 0 4px 28px rgba(139,124,246,0.55); }
.btn-export:active { opacity: .85; transform: scale(.97); }

.btn-copy {
  background: var(--surface);
  color: var(--accent);
  border: 1.5px solid rgba(139,124,246,0.35);
  border-radius: 30px;
  padding: 12px 20px;
  font-size: 14px; font-family: var(--zh); font-weight: 600;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, opacity .15s, transform .1s;
}
.btn-copy:hover { border-color: rgba(139,124,246,0.55); box-shadow: 0 2px 12px rgba(139,124,246,0.18); }
.btn-copy:active { opacity: .85; transform: scale(.97); }

.loading { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 16px; }
.err     { color: #ff6b6b; padding: 24px; text-align: center; font-size: 15px; }

/* ══ READING VIEW ═════════════════════════════════════════ */
#reading-view {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  overflow-y: auto;
  z-index: 50;
  -webkit-overflow-scrolling: touch;
}
#reading-view.open { display: block; }

.rd-hdr {
  position: sticky; top: 0; z-index: 5;
  background: rgba(12,13,20,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
}
.btn-back {
  background: none; border: none;
  color: var(--accent); font-family: var(--zh);
  font-size: 15px; font-weight: 600;
  cursor: pointer; padding: 4px 0;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s;
}
.btn-back:hover { opacity: .7; }
.rd-tags { display: flex; gap: 5px; flex-wrap: wrap; }

.art-wrap {
  max-width: 660px;
  margin: 0 auto;
  padding: 24px 20px 220px;
}

.art-title {
  font-size: 21px; font-weight: 700;
  line-height: 1.5; margin-bottom: 24px;
  color: var(--text);
}

/* Ruby / pinyin — generous line-height to accommodate rt above characters */
.art-text {
  font-size: 20px;
  line-height: 2.7;
  color: var(--text);
  word-break: normal;
  overflow-wrap: break-word;
}
@media (max-width: 380px) { .art-text { font-size: 18px; } }

ruby { display: inline; }
rt {
  font-size: 0;       /* hidden by default — no height impact */
  line-height: 0;
  color: var(--accent);
  font-family: var(--en);
  letter-spacing: 0.01em;
  display: block;
}
ruby.py-on rt {
  font-size: 0.5em;
  line-height: 1.1;
}
ruby.word-name rt { color: var(--accent-2); }

.word {
  display: inline;
  cursor: pointer;
  border-radius: 3px;
  padding: 2px 1px;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .12s;
}
.word:hover { background: rgba(139,124,246,0.13); }
.word.unk {
  background: rgba(139,124,246,0.15);
  border-bottom: 2px solid var(--accent);
  text-shadow: 0 0 14px rgba(139,124,246,0.55);
}

/* Name tokens */
.word.word-name {
  color: var(--accent-2);
}
.word.word-name:hover { background: rgba(110,168,254,0.11); }
.word.word-name.unk {
  color: var(--accent);
  background: rgba(139,124,246,0.15);
  border-bottom: 2px solid var(--accent);
}

.punct { display: inline; }

/* ══ COMPREHENSION ════════════════════════════════════════ */
.comp-block {
  margin-top: 40px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: 0 2px 14px rgba(0,0,0,.35);
  padding: 18px;
}
.comp-q + .comp-q { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
.blk-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: .07em;
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px;
  font-family: var(--en);
}
.q-text { font-size: 17px; line-height: 1.75; margin-bottom: 12px; color: var(--text); }

.btn-show {
  background: rgba(139,124,246,0.1);
  color: var(--accent);
  border: 1px solid rgba(139,124,246,0.22);
  border-radius: 8px; padding: 8px 16px;
  font-family: var(--zh); font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-show:hover  { background: rgba(139,124,246,0.18); }
.btn-show:active { background: rgba(139,124,246,0.24); }

.ans-text {
  display: none;
  margin: 12px 0 0;
  font-size: 16px; line-height: 1.75;
  padding: 12px;
  background: rgba(139,124,246,0.07);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
  color: var(--text);
}
.ans-text.vis { display: block; }

.comp-btns { display: none; gap: 8px; margin-top: 12px; }
.comp-btns.vis { display: flex; }
.comp-btns.col { flex-direction: column; }

.btn-comp {
  flex: 1; padding: 10px 6px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--zh); font-size: 14px;
  cursor: pointer; text-align: center;
  transition: all .15s;
}
.btn-comp:disabled { cursor: default; }
.comp-btns.col .btn-comp { text-align: left; padding: 10px 12px; }
.btn-comp.ok {
  background: rgba(139,124,246,0.12);
  border-color: rgba(139,124,246,0.4);
  color: var(--accent);
  font-weight: 600;
}
.btn-comp.nok {
  background: rgba(255,107,107,0.08);
  border-color: rgba(255,107,107,0.32);
  color: #ff8080;
  font-weight: 600;
}

/* ══ RATINGS + COMMENT ════════════════════════════════════ */
.rates { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }

.rate-blk {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: 0 2px 14px rgba(0,0,0,.35);
  padding: 16px 18px;
}
.rate-lbl { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
.rate-row  { display: flex; gap: 8px; }

.btn-rate {
  flex: 1; padding: 10px 4px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--zh); font-size: 13px;
  cursor: pointer; text-align: center;
  transition: border-color .2s, color .2s, box-shadow .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.btn-rate:hover { border-color: rgba(139,124,246,0.28); color: var(--text); }
.btn-rate:active { transform: scale(.96); }
.btn-rate.sel {
  background: var(--accent-grad);
  border-color: transparent;
  color: #fff; font-weight: 600;
  box-shadow: 0 0 18px rgba(139,124,246,0.38);
}

/* Comment block */
.comment-blk {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
}
.comment-blk textarea {
  width: 100%;
  min-height: 78px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--zh);
  font-size: 15px;
  line-height: 1.7;
  padding: 10px 12px;
  resize: vertical;
  outline: none;
  margin-top: 8px;
  transition: border-color .2s;
  display: block;
}
.comment-blk textarea:focus { border-color: rgba(139,124,246,0.4); }
.comment-blk textarea::placeholder { color: var(--text-muted); }

.done-banner {
  display: none; margin-top: 14px;
  text-align: center; font-size: 14px;
  color: var(--accent); font-weight: 600;
  background: rgba(139,124,246,0.08);
  border: 1px solid rgba(139,124,246,0.22);
  padding: 12px; border-radius: 8px;
}
.done-banner.vis { display: block; }

/* ══ DEFINITION PANEL ═════════════════════════════════════ */
#def-panel {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 100;
  background: var(--surface-2);
  border-top: 1px solid rgba(139,124,246,0.18);
  box-shadow: 0 -4px 40px rgba(0,0,0,.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform .22s cubic-bezier(.34,1.26,.64,1);
}
#def-panel.open { transform: translateY(0); }

.def-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.def-zh {
  font-size: 36px; font-weight: 700; line-height: 1.1;
  color: var(--accent);
  text-shadow: 0 0 22px rgba(139,124,246,0.45);
}
.def-py   { font-size: 16px; color: var(--accent-2); font-family: var(--en); margin-top: 5px; letter-spacing: .02em; }
.def-gl   { font-size: 14px; color: var(--text-muted); font-family: var(--en); margin-top: 2px; }
.def-hint { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 10px; }

.btn-close {
  background: none; border: none;
  font-size: 20px; color: var(--text-muted);
  cursor: pointer; padding: 0 0 0 12px;
  line-height: 1; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.btn-close:hover { color: var(--text); }
</style>
</head>
<body>

<!-- ══ WEEK VIEW ═══════════════════════════════════════════ -->
<div id="week-view">
  <div class="wk-hdr">
    <h1 id="wk-title">中文阅读器</h1>
    <span class="pill" id="wk-pill">— / —</span>
  </div>
  <div class="week-picker" id="week-picker"></div>
  <div class="day-list" id="day-list">
    <div class="loading">加载中…</div>
  </div>
  <div class="wk-foot">
    <button class="btn-export" id="btn-export">导出本周反馈</button>
    <button class="btn-copy"   id="btn-copy">复制反馈</button>
  </div>
</div>

<!-- ══ READING VIEW ════════════════════════════════════════ -->
<div id="reading-view">
  <div class="rd-hdr">
    <button class="btn-back" id="btn-back">← 返回</button>
    <div class="rd-tags" id="rd-tags"></div>
  </div>
  <div class="art-wrap">
    <h2 class="art-title" id="art-title"></h2>
    <div class="art-text" id="art-text"></div>
    <div id="comp-sec"></div>
    <div class="rates" id="rates-sec"></div>
    <div class="done-banner" id="done-banner">✓ 本文已完成！</div>
  </div>
</div>

<!-- ══ DEFINITION PANEL ════════════════════════════════════ -->
<div id="def-panel">
  <div class="def-row">
    <div>
      <div class="def-zh" id="def-zh"></div>
      <div class="def-py" id="def-py"></div>
      <div class="def-gl" id="def-gl"></div>
    </div>
    <button class="btn-close" id="btn-close-def" aria-label="关闭">✕</button>
  </div>
  <div class="def-hint" id="def-hint"></div>
</div>

<script>
(function () {
'use strict';

/* ── constants ──────────────────────────────────────────── */
var TYPE_ZH = { article: '文章', dialogue: '对话', story: '故事' };

/* ── shared state ───────────────────────────────────────── */
var S = {
  week:     1,
  manifest: { weeks: [1], latest: 1 },
  index:    null,
  art:      {},
  curId:    null,
  tokens:   [],
  defOpen:  false,
};

/* ── localStorage ───────────────────────────────────────── */
function lsKey(id) { return 'cr_w' + S.week + '_' + id; }

function blank() {
  return { unkns: [], diff: null, topic: null, comp: [], done: false, comment: '' };
}

function loadSt(id) {
  try {
    var r = localStorage.getItem(lsKey(id));
    if (!r) return blank();
    var parsed = JSON.parse(r);
    var st = Object.assign(blank(), parsed);
    /* migrate old comp: string → [{correct}] */
    if (typeof st.comp === 'string') {
      st.comp = [{ correct: st.comp === 'got_it' }];
    } else if (!Array.isArray(st.comp)) {
      st.comp = [];
    }
    if (typeof st.comment !== 'string') st.comment = '';
    return st;
  } catch(e) { return blank(); }
}

function saveSt(id, st) {
  try { localStorage.setItem(lsKey(id), JSON.stringify(st)); } catch(e) {}
}

/* ── fetch ──────────────────────────────────────────────── */
function weekDir() {
  return '../weeks/week-' + String(S.week).padStart(2, '0');
}

function jfetch(url) {
  return fetch(url + '?t=' + Date.now()).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + url);
    return r.json();
  });
}

/* ── HTML escape ────────────────────────────────────────── */
function h(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══ INIT ═══════════════════════════════════════════════════ */
function init() {
  var p = new URLSearchParams(location.search);
  var weekParam = p.get('week');

  jfetch('../weeks/manifest.json').then(function(manifest) {
    S.manifest = manifest;
    S.week = weekParam
      ? Math.max(1, parseInt(weekParam, 10) || 1)
      : (manifest.latest || 1);
    afterManifest();
  }).catch(function() {
    /* no manifest — fall back to week 1 */
    S.week = weekParam ? Math.max(1, parseInt(weekParam, 10) || 1) : 1;
    afterManifest();
  });
}

function afterManifest() {
  renderWeekPicker();
  document.getElementById('wk-title').textContent = '第 ' + S.week + ' 周';
  loadWeekIndex();
}

/* ══ WEEK PICKER ════════════════════════════════════════════ */
function renderWeekPicker() {
  var picker = document.getElementById('week-picker');
  picker.innerHTML = '';
  (S.manifest.weeks || [1]).forEach(function(w) {
    var btn = document.createElement('button');
    btn.className = 'btn-week' + (w === S.week ? ' active' : '');
    btn.textContent = '第' + w + '周';
    btn.addEventListener('click', function() {
      if (w === S.week) return;
      switchWeek(w);
    });
    picker.appendChild(btn);
  });
}

function switchWeek(w) {
  S.week = w;
  S.art  = {};
  S.index = null;
  history.replaceState(null, '', '?week=' + w);
  document.getElementById('wk-title').textContent = '第 ' + w + ' 周';
  document.querySelectorAll('.btn-week').forEach(function(btn) {
    btn.classList.toggle('active', btn.textContent === '第' + w + '周');
  });
  document.getElementById('day-list').innerHTML = '<div class="loading">加载中…</div>';
  loadWeekIndex();
}

function loadWeekIndex() {
  jfetch(weekDir() + '/index.json').then(function(idx) {
    S.index = idx;
    renderWeek();
  }).catch(function(e) {
    document.getElementById('day-list').innerHTML =
      '<div class="err">无法加载第 ' + S.week + ' 周数据。<br><small>' + h(e.message) + '</small></div>';
  });
}

/* ══ WEEK VIEW ══════════════════════════════════════════════ */
function renderWeek() {
  var list = document.getElementById('day-list');
  list.innerHTML = '';
  var done = 0;
  var total = S.index.articles.length;

  S.index.articles.forEach(function(a) {
    var st = loadSt(a.id);
    if (st.done) done++;
    list.appendChild(makeCard(a, st));
  });

  document.getElementById('wk-pill').textContent = done + ' / ' + total;
}

function makeCard(a, st) {
  var card = document.createElement('div');
  card.className = 'day-card' + (st.done ? ' done' : '');

  var typeLabel = TYPE_ZH[a.type] || a.type;
  var doneTag   = st.done ? '<span class="tag done">✓ 完成</span>' : '';

  card.innerHTML =
    '<div class="day-num">' + a.day + '</div>' +
    '<div class="card-info">' +
      '<div class="card-title">' + h(a.title) + '</div>' +
      '<div class="card-tags">' +
        '<span class="tag">' + h(typeLabel) + '</span>' +
        '<span class="tag">' + h(a.topic) + '</span>' +
        '<span class="tag lvl">' + h(a.target_level) + '</span>' +
        doneTag +
      '</div>' +
    '</div>' +
    '<div class="done-icon">' + (st.done ? '✓' : '○') + '</div>';

  card.addEventListener('click', function() { openArt(a.id); });
  return card;
}

/* ══ READING VIEW ═══════════════════════════════════════════ */
function openArt(id) {
  var load = S.art[id]
    ? Promise.resolve(S.art[id])
    : jfetch(weekDir() + '/' + id + '.json').then(function(d) {
        S.art[id] = d; return d;
      });

  load.then(function(art) {
    S.curId  = id;
    S.tokens = art.tokens;

    var st = loadSt(id);

    document.getElementById('week-view').style.display = 'none';
    var rv = document.getElementById('reading-view');
    rv.classList.add('open');
    rv.scrollTop = 0;

    document.getElementById('art-title').textContent = art.title;
    document.getElementById('rd-tags').innerHTML =
      '<span class="tag">' + h(TYPE_ZH[art.type] || art.type) + '</span>' +
      '<span class="tag">' + h(art.topic) + '</span>' +
      '<span class="tag lvl">' + h(art.target_level) + '</span>';

    buildText(art.tokens, st.unkns);
    buildComp(art.comprehension || [], st);
    buildRatings(st);
    document.getElementById('done-banner').classList.toggle('vis', !!st.done);
    closePanel();

  }).catch(function(e) {
    alert('加载失败：' + e.message);
  });
}

/* ── token rendering with ruby ──────────────────────────── */
function buildText(tokens, unknArr) {
  var unkSet = new Set(unknArr);
  var el = document.getElementById('art-text');
  el.innerHTML = '';
  var frag = document.createDocumentFragment();

  tokens.forEach(function(tok, i) {
    if (tok.punct) {
      var s = document.createElement('span');
      s.className   = 'punct';
      s.textContent = tok.t;
      frag.appendChild(s);
      return;
    }

    var isName  = !!tok.name;
    var isFirst = !!tok.first;   /* first occurrence of a name → always show pinyin */
    var isUnk   = unkSet.has(i);
    var showPy  = isUnk || isFirst;

    var ruby = document.createElement('ruby');
    var cls = 'word';
    if (isName)  cls += ' word-name';
    if (isUnk)   cls += ' unk';
    if (showPy)  cls += ' py-on';
    ruby.className = cls;
    ruby.dataset.i = i;
    ruby.addEventListener('click', onWordTap);

    ruby.appendChild(document.createTextNode(tok.t));

    var rt = document.createElement('rt');
    rt.textContent = showPy ? (tok.py || '') : '';
    ruby.appendChild(rt);

    frag.appendChild(ruby);
  });

  el.appendChild(frag);
}

function onWordTap() {
  var idx = parseInt(this.dataset.i, 10);
  var tok = S.tokens[idx];

  /* name tokens: show panel only, don't add to unkns */
  if (tok.name) {
    showPanel(tok, false, true);
    return;
  }

  var st  = loadSt(S.curId);
  var unk = new Set(st.unkns);
  var rt  = this.querySelector('rt');

  if (unk.has(idx)) {
    unk.delete(idx);
    this.classList.remove('unk');
    /* only hide pinyin if not a first-occurrence name token */
    if (!tok.first) {
      this.classList.remove('py-on');
      if (rt) rt.textContent = '';
    }
  } else {
    unk.add(idx);
    this.classList.add('unk');
    this.classList.add('py-on');
    if (rt) rt.textContent = tok.py || '';
  }

  st.unkns = Array.from(unk);
  saveSt(S.curId, st);
  showPanel(tok, unk.has(idx), false);
}

/* ── definition panel ───────────────────────────────────── */
function showPanel(tok, isUnk, isName) {
  document.getElementById('def-zh').textContent = tok.t;
  document.getElementById('def-py').textContent = tok.py || '';
  document.getElementById('def-gl').textContent = tok.g  || '';

  var hint = '';
  if (isName) {
    hint = '专有名词';
  } else if (isUnk) {
    hint = '已标记为生词 · 再次点击可取消标记';
  } else {
    hint = '已取消标记 · 点击词语可重新标记';
  }
  document.getElementById('def-hint').textContent = hint;
  document.getElementById('def-panel').classList.add('open');
  S.defOpen = true;
}

function closePanel() {
  document.getElementById('def-panel').classList.remove('open');
  S.defOpen = false;
}

/* ── comprehension ──────────────────────────────────────── */
/*
 * Handles three question shapes:
 *   legacy open:      { q, a }                           — show/hide answer + self-assess
 *   true_false:       { type:"true_false",  q, answer }  — 对/错 buttons
 *   multiple_choice:  { type:"multiple_choice", q, options:[], answer:N }
 */
function buildComp(items, st) {
  var el = document.getElementById('comp-sec');
  el.innerHTML = '';
  if (!items.length) return;

  var block = document.createElement('div');
  block.className = 'comp-block';

  var lbl = document.createElement('div');
  lbl.className = 'blk-lbl';
  lbl.textContent = '理解问题';
  block.appendChild(lbl);

  items.forEach(function(q, qi) {
    var entry    = st.comp && st.comp[qi] != null ? st.comp[qi] : null;
    var answered = entry !== null;
    var type     = q.type || 'open';

    var qDiv = document.createElement('div');
    qDiv.className = 'comp-q';

    var qText = document.createElement('p');
    qText.className = 'q-text';
    qText.textContent = q.q;
    qDiv.appendChild(qText);

    if (type === 'open') {
      buildOpenQ(qDiv, q, qi, answered, entry);
    } else if (type === 'true_false') {
      buildTFQ(qDiv, q, qi, answered, entry);
    } else if (type === 'multiple_choice') {
      buildMCQ(qDiv, q, qi, answered, entry);
    }

    block.appendChild(qDiv);
  });

  el.appendChild(block);
}

function buildOpenQ(qDiv, q, qi, answered, entry) {
  if (!answered) {
    var btnShow = document.createElement('button');
    btnShow.className = 'btn-show';
    btnShow.textContent = '显示答案';
    qDiv.appendChild(btnShow);
  }

  var ansEl = document.createElement('div');
  ansEl.className = 'ans-text' + (answered ? ' vis' : '');
  ansEl.textContent = q.a;
  qDiv.appendChild(ansEl);

  var btnsEl = document.createElement('div');
  btnsEl.className = 'comp-btns' + (answered ? ' vis' : '');

  var gotIt  = makeCompBtn('✓ 答对了', answered && entry && entry.correct  ? 'ok'  : '');
  gotIt.dataset.v = 'true';
  var missed = makeCompBtn('✗ 没答对',  answered && entry && !entry.correct ? 'nok' : '');
  missed.dataset.v = 'false';

  btnsEl.appendChild(gotIt);
  btnsEl.appendChild(missed);
  qDiv.appendChild(btnsEl);

  if (!answered) {
    qDiv.querySelector('.btn-show').addEventListener('click', function() {
      this.style.display = 'none';
      ansEl.classList.add('vis');
      btnsEl.classList.add('vis');
    });
  }

  btnsEl.querySelectorAll('.btn-comp').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (answered) return;
      var isCorrect = this.dataset.v === 'true';
      saveComp(qi, { correct: isCorrect });
      answered = true;
      btnsEl.querySelectorAll('.btn-comp').forEach(function(b) { b.className = 'btn-comp'; });
      this.className = 'btn-comp ' + (isCorrect ? 'ok' : 'nok');
    });
  });
}

function buildTFQ(qDiv, q, qi, answered, entry) {
  var btnsEl = document.createElement('div');
  btnsEl.className = 'comp-btns vis';
  /* answer may be a boolean (true=对, false=错) or already a string */
  var correctAns = q.answer === true ? '对' : q.answer === false ? '错' : q.answer;

  ['对', '错'].forEach(function(opt) {
    var isCorrect = opt === correctAns;
    var cls = '';
    if (answered) {
      if (entry && ((opt === '对') === entry.correct) && isCorrect) cls = 'ok';
      else if (answered && entry && ((opt === '对') !== entry.correct) && !isCorrect) cls = '';
      /* highlight: correct answer = ok; if they chose wrong, chosen = nok, correct = ok */
      var theyChose = entry && entry.selected === opt;
      if (theyChose && entry.correct)  cls = 'ok';
      else if (theyChose && !entry.correct) cls = 'nok';
      else if (isCorrect && answered && !entry.correct) cls = 'ok';
      else cls = '';
    }
    var btn = makeCompBtn(opt, cls);
    if (answered) btn.disabled = true;
    btn.addEventListener('click', function() {
      if (answered) return;
      var correct = (opt === correctAns);
      saveComp(qi, { correct: correct, selected: opt });
      answered = true;
      btnsEl.querySelectorAll('.btn-comp').forEach(function(b) {
        b.disabled = true;
        b.className = 'btn-comp';
      });
      btn.className = 'btn-comp ' + (correct ? 'ok' : 'nok');
      if (!correct) {
        btnsEl.querySelectorAll('.btn-comp').forEach(function(b) {
          if (b.textContent === correctAns) b.className = 'btn-comp ok';
        });
      }
    });
    btnsEl.appendChild(btn);
  });

  qDiv.appendChild(btnsEl);
}

function buildMCQ(qDiv, q, qi, answered, entry) {
  var btnsEl = document.createElement('div');
  btnsEl.className = 'comp-btns vis col';
  /* support both answer_index (new) and answer (legacy) field names */
  var correctIdx = q.answer_index !== undefined ? q.answer_index : q.answer;

  (q.options || []).forEach(function(opt, oi) {
    var isCorrect = oi === correctIdx;
    var cls = '';
    if (answered) {
      var theyChoseThis = entry && entry.selected === oi;
      if (theyChoseThis && entry.correct)  cls = 'ok';
      else if (theyChoseThis && !entry.correct) cls = 'nok';
      else if (isCorrect && answered && entry && !entry.correct) cls = 'ok';
    }
    var btn = makeCompBtn(opt, cls);
    if (answered) btn.disabled = true;
    btn.addEventListener('click', function() {
      if (answered) return;
      var correct = (oi === correctIdx);
      saveComp(qi, { correct: correct, selected: oi });
      answered = true;
      btnsEl.querySelectorAll('.btn-comp').forEach(function(b) {
        b.disabled = true;
        b.className = 'btn-comp';
      });
      btn.className = 'btn-comp ' + (correct ? 'ok' : 'nok');
      if (!correct) {
        btnsEl.querySelectorAll('.btn-comp')[correctIdx].className = 'btn-comp ok';
      }
    });
    btnsEl.appendChild(btn);
  });

  qDiv.appendChild(btnsEl);
}

function makeCompBtn(text, extraCls) {
  var btn = document.createElement('button');
  btn.className = 'btn-comp' + (extraCls ? ' ' + extraCls : '');
  btn.textContent = text;
  return btn;
}

function saveComp(qi, val) {
  var st2 = loadSt(S.curId);
  if (!Array.isArray(st2.comp)) st2.comp = [];
  while (st2.comp.length <= qi) st2.comp.push(null);
  st2.comp[qi] = val;
  saveSt(S.curId, st2);
}

/* ── ratings + comment ──────────────────────────────────── */
function buildRatings(st) {
  var el = document.getElementById('rates-sec');

  el.innerHTML =
    '<div class="rate-blk">' +
      '<div class="rate-lbl">难度</div>' +
      '<div class="rate-row">' +
        rateBtn('diff', 'too_easy',   '太简单', st.diff) +
        rateBtn('diff', 'just_right', '刚刚好', st.diff) +
        rateBtn('diff', 'too_hard',   '太难了', st.diff) +
      '</div>' +
    '</div>' +
    '<div class="rate-blk">' +
      '<div class="rate-lbl">主题</div>' +
      '<div class="rate-row">' +
        rateBtn('topic', 'liked',    '喜欢',  st.topic) +
        rateBtn('topic', 'meh',      '还好',  st.topic) +
        rateBtn('topic', 'disliked', '不喜欢', st.topic) +
      '</div>' +
    '</div>' +
    '<div class="comment-blk">' +
      '<div class="rate-lbl">感想（用中文写，可选）</div>' +
      '<textarea id="art-comment" placeholder="写下你的感想…">' +
        h(st.comment || '') +
      '</textarea>' +
    '</div>';

  el.querySelectorAll('.btn-rate').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var g = this.dataset.g, v = this.dataset.v;
      var st2 = loadSt(S.curId);
      if (g === 'diff') st2.diff = v; else st2.topic = v;
      saveSt(S.curId, st2);
      el.querySelectorAll('.btn-rate[data-g="' + g + '"]').forEach(function(b) {
        b.classList.remove('sel');
      });
      this.classList.add('sel');
      checkDone(st2);
    });
  });

  var ta = document.getElementById('art-comment');
  ta.addEventListener('input', function() {
    var st2 = loadSt(S.curId);
    st2.comment = this.value;
    saveSt(S.curId, st2);
  });
}

function rateBtn(group, val, label, current) {
  return '<button class="btn-rate' + (current === val ? ' sel' : '') +
    '" data-g="' + group + '" data-v="' + val + '">' + label + '</button>';
}

function checkDone(st) {
  if (st.diff && st.topic && !st.done) {
    st.done = true;
    saveSt(S.curId, st);
    document.getElementById('done-banner').classList.add('vis');
  }
}

/* ── navigation ─────────────────────────────────────────── */
function goBack() {
  closePanel();
  document.getElementById('reading-view').classList.remove('open');
  document.getElementById('week-view').style.display = '';
  S.curId = null;
  renderWeek();
  window.scrollTo(0, 0);
}

/* ══ EXPORT / COPY ══════════════════════════════════════════ */
function buildExportData() {
  var arts  = S.index.articles;
  var loads = arts.map(function(a) {
    if (S.art[a.id]) return Promise.resolve(S.art[a.id]);
    return jfetch(weekDir() + '/' + a.id + '.json').then(function(d) {
      S.art[a.id] = d; return d;
    }).catch(function() { return null; });
  });

  return Promise.all(loads).then(function(artDatas) {
    var articles = arts.map(function(a, i) {
      var artData     = artDatas[i];
      var st          = loadSt(a.id);
      var tappable    = artData
        ? artData.tokens.filter(function(t) { return !t.punct && !t.name; }).length : 0;

      var wordsTapped = [];
      if (artData) {
        st.unkns.forEach(function(idx) {
          var tok = artData.tokens[idx];
          if (tok && !tok.punct) wordsTapped.push({ t: tok.t, py: tok.py || '', g: tok.g || '' });
        });
      }

      var compItems = (artData && artData.comprehension) ? artData.comprehension : [];
      var comprehension = compItems.map(function(q, qi) {
        var entry = st.comp && st.comp[qi] != null ? st.comp[qi] : null;
        return {
          type:    q.type || 'open',
          correct: entry !== null ? !!entry.correct : null,
        };
      });

      return {
        id:               a.id,
        topic:            a.topic,
        register:         a.register,
        type:             a.type,
        target_level:     a.target_level,
        completed:        !!st.done,
        difficulty_rating: st.diff  || null,
        topic_rating:      st.topic || null,
        comprehension:     comprehension,
        comment:           st.comment || '',
        words_tapped:      wordsTapped,
        unknown_rate:      tappable > 0
          ? parseFloat((st.unkns.length / tappable).toFixed(4)) : 0,
      };
    });

    return { week: S.week, exported_at: new Date().toISOString(), articles: articles };
  });
}

function doExport() {
  buildExportData().then(function(blob) {
    var url = URL.createObjectURL(
      new Blob([JSON.stringify(blob, null, 2)], { type: 'application/json' })
    );
    var a = document.createElement('a');
    a.href = url;
    a.download = 'week-' + S.week + '-feedback.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  });
}

function doCopy() {
  buildExportData().then(function(blob) {
    var text = JSON.stringify(blob, null, 2);
    var btn  = document.getElementById('btn-copy');

    function flash() {
      btn.textContent = '✓ 已复制';
      setTimeout(function() { btn.textContent = '复制反馈'; }, 2200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-9999px;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash(); } catch(e) {}
      document.body.removeChild(ta);
    }
  });
}

/* ── wire up events ─────────────────────────────────────── */
document.getElementById('btn-back').addEventListener('click', goBack);
document.getElementById('btn-close-def').addEventListener('click', closePanel);
document.getElementById('btn-export').addEventListener('click', doExport);
document.getElementById('btn-copy').addEventListener('click', doCopy);

document.getElementById('reading-view').addEventListener('scroll', function() {
  if (S.defOpen) closePanel();
}, { passive: true });

document.getElementById('art-text').addEventListener('click', function(e) {
  if (e.target === this && S.defOpen) closePanel();
});

init();
}());
