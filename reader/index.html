<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文阅读器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0c0d14;
  --surface:     #15161f;
  --surface-2:   #1c1e2b;
  --border:      rgba(255,255,255,0.08);
  --text:        #e8e8f0;
  --text-muted:  #9a9ab2;
  --accent:      #8b7cf6;
  --accent-2:    #6ea8fe;
  --accent-grad: linear-gradient(135deg, #8b7cf6, #6ea8fe);
  --r:           12px;
  --zh: "PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",
        "Microsoft YaHei UI","Microsoft YaHei","STHeiti",
        "WenQuanYi Micro Hei",sans-serif;
  --en: -apple-system,"Segoe UI","Helvetica Neue",sans-serif;
}

html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--zh);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ══ WEEK VIEW ════════════════════════════════════════════ */
#week-view {
  max-width: 660px;
  margin: 0 auto;
  padding: 0 16px 100px;
}

.wk-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 32px 0 16px;
  position: relative;
}
.wk-hdr::before {
  content: '';
  position: absolute;
  top: -24px; left: -40px; right: -40px; height: 130px;
  background: radial-gradient(ellipse at 50% 0%, rgba(139,124,246,0.13) 0%, transparent 70%);
  pointer-events: none;
}
.wk-hdr h1 { font-size: 24px; font-weight: 700; }

.pill {
  background: rgba(139,124,246,0.15);
  color: var(--accent);
  border: 1px solid rgba(139,124,246,0.3);
  font-size: 13px;
  font-weight: 700;
  padding: 4px 13px;
  border-radius: 20px;
  font-family: var(--en);
}

/* Week picker */
.week-picker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 7px 9px 7px 13px;
  margin-bottom: 18px;
}
.week-picker label {
  color: var(--text-muted);
  font-family: var(--zh);
  font-size: 13px;
  font-weight: 700;
}
.week-select-wrap {
  position: relative;
}
.week-select-wrap::after {
  content: '⌄';
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-55%);
  color: var(--accent);
  pointer-events: none;
  font-family: var(--en);
  font-size: 15px;
}
.week-select {
  appearance: none;
  -webkit-appearance: none;
  min-width: 112px;
  background: rgba(139,124,246,0.13);
  border: 1px solid rgba(139,124,246,0.3);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--zh);
  font-size: 14px;
  font-weight: 650;
  padding: 7px 32px 7px 11px;
  cursor: pointer;
  outline: none;
  transition: border-color .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}
.week-select:hover, .week-select:focus { border-color: rgba(139,124,246,0.65); background: rgba(139,124,246,0.18); }
.week-select option { background: var(--surface-2); color: var(--text); }

.day-list { display: flex; flex-direction: column; gap: 10px; }

.day-card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: 0 1px 6px rgba(0,0,0,.35);
  border: 1.5px solid var(--border);
  padding: 15px 16px;
  display: flex;
  align-items: center;
  gap: 13px;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.day-card:hover {
  border-color: rgba(139,124,246,0.28);
  box-shadow: 0 2px 16px rgba(0,0,0,.45);
}
.day-card:active { transform: scale(.98); }
.day-card.done {
  border-color: rgba(139,124,246,0.45);
  background: rgba(139,124,246,0.05);
  box-shadow: 0 0 20px rgba(139,124,246,0.09);
}

.day-num {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(139,124,246,0.12);
  color: var(--accent);
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-family: var(--en);
}
.day-card.done .day-num {
  background: rgba(139,124,246,0.22);
  color: var(--accent);
}

.card-info { flex: 1; min-width: 0; }
.card-title {
  font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

.tag {
  font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 5px;
  background: rgba(139,124,246,0.1);
  color: var(--accent);
  border: 1px solid rgba(139,124,246,0.2);
  font-family: var(--en);
}
.tag.lvl {
  background: rgba(110,168,254,0.1);
  color: var(--accent-2);
  border-color: rgba(110,168,254,0.2);
}
.tag.done {
  background: rgba(139,124,246,0.15);
  color: var(--accent);
  border-color: rgba(139,124,246,0.35);
}

.done-icon { font-size: 18px; color: rgba(255,255,255,0.15); flex-shrink: 0; }
.day-card.done .done-icon { color: var(--accent); }

.wk-foot {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px 20px;
  display: flex; justify-content: center; align-items: center;
  gap: 10px; flex-wrap: wrap;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  pointer-events: none;
}
.wk-foot button { pointer-events: all; }

.btn-export {
  background: var(--accent-grad);
  color: #fff;
  border: none; border-radius: 30px;
  padding: 13px 28px;
  font-size: 15px; font-family: var(--zh); font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 18px rgba(139,124,246,0.38);
  transition: box-shadow .2s, opacity .15s, transform .1s;
}
.btn-export:hover { box-shadow: 0 4px 28px rgba(139,124,246,0.55); }
.btn-export:active { opacity: .85; transform: scale(.97); }

.btn-copy {
  background: var(--surface);
  color: var(--accent);
  border: 1.5px solid rgba(139,124,246,0.35);
  border-radius: 30px;
  padding: 12px 20px;
  font-size: 14px; font-family: var(--zh); font-weight: 600;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, opacity .15s, transform .1s;
}
.btn-copy:hover { border-color: rgba(139,124,246,0.55); box-shadow: 0 2px 12px rgba(139,124,246,0.18); }
.btn-copy:active { opacity: .85; transform: scale(.97); }

.loading { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 16px; }
.err     { color: #ff6b6b; padding: 24px; text-align: center; font-size: 15px; }

/* ══ READING VIEW ═════════════════════════════════════════ */
#reading-view {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  overflow-y: auto;
  z-index: 50;
  -webkit-overflow-scrolling: touch;
}
#reading-view.open { display: block; }

.rd-hdr {
  position: sticky; top: 0; z-index: 5;
  background: rgba(12,13,20,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
}
.btn-back {
  background: none; border: none;
  color: var(--accent); font-family: var(--zh);
  font-size: 15px; font-weight: 600;
  cursor: pointer; padding: 4px 0;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s;
}
.btn-back:hover { opacity: .7; }
.rd-tags { display: flex; gap: 5px; flex-wrap: wrap; }

.art-wrap {
  max-width: 660px;
  margin: 0 auto;
  padding: 24px 20px 220px;
}

.art-title {
  font-size: 21px; font-weight: 700;
  line-height: 1.5; margin-bottom: 24px;
  color: var(--text);
}

/* Ruby / pinyin — generous line-height to accommodate rt above characters */
.art-text {
  font-size: 20px;
  line-height: 2.7;
  color: var(--text);
  word-break: normal;
  overflow-wrap: break-word;
}
@media (max-width: 380px) { .art-text { font-size: 18px; } }

ruby {
  ruby-position: over;
  -webkit-ruby-position: before; /* Safari legacy: 'before' = above */
}
rt {
  font-size: 0;       /* hidden by default — no height impact */
  line-height: 0;
  color: var(--accent);
  font-family: var(--en);
  letter-spacing: 0.01em;
}
ruby.py-on rt {
  font-size: 0.5em;
  line-height: 1.1;
}
ruby.word-name rt { color: var(--accent-2); }

.word {
  cursor: pointer;
  border-radius: 3px;
  padding: 2px 1px;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .12s;
}
.word:hover { background: rgba(139,124,246,0.13); }
.word.unk {
  background: rgba(139,124,246,0.15);
  border-bottom: 2px solid var(--accent);
  text-shadow: 0 0 14px rgba(139,124,246,0.55);
}

/* Name tokens */
.word.word-name {
  color: var(--accent-2);
}
.word.word-name:hover { background: rgba(110,168,254,0.11); }
.word.word-name.unk {
  color: var(--accent);
  background: rgba(139,124,246,0.15);
  border-bottom: 2px solid var(--accent);
}

.punct { display: inline; }
.plain { display: inline; }

/* ══ COMPREHENSION ════════════════════════════════════════ */
.comp-block {
  margin-top: 40px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: 0 2px 14px rgba(0,0,0,.35);
  padding: 18px;
}
.comp-q + .comp-q { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
.blk-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: .07em;
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px;
  font-family: var(--en);
}
.q-text { font-size: 17px; line-height: 1.75; margin-bottom: 12px; color: var(--text); }

.btn-show {
  background: rgba(139,124,246,0.1);
  color: var(--accent);
  border: 1px solid rgba(139,124,246,0.22);
  border-radius: 8px; padding: 8px 16px;
  font-family: var(--zh); font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-show:hover  { background: rgba(139,124,246,0.18); }
.btn-show:active { background: rgba(139,124,246,0.24); }

.ans-text {
  display: none;
  margin: 12px 0 0;
  font-size: 16px; line-height: 1.75;
  padding: 12px;
  background: rgba(139,124,246,0.07);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
  color: var(--text);
}
.ans-text.vis { display: block; }

.comp-btns { display: none; gap: 8px; margin-top: 12px; }
.comp-btns.vis { display: flex; }
.comp-btns.col { flex-direction: column; }

.btn-comp {
  flex: 1; padding: 10px 6px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--zh); font-size: 14px;
  cursor: pointer; text-align: center;
  transition: all .15s;
}
.btn-comp:disabled { cursor: default; }
.comp-btns.col .btn-comp { text-align: left; padding: 10px 12px; }
.btn-comp.ok {
  background: rgba(139,124,246,0.12);
  border-color: rgba(139,124,246,0.4);
  color: var(--accent);
  font-weight: 600;
}
.btn-comp.nok {
  background: rgba(255,107,107,0.08);
  border-color: rgba(255,107,107,0.32);
  color: #ff8080;
  font-weight: 600;
}

/* ══ RATINGS + COMMENT ════════════════════════════════════ */
.rates { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }

.rate-blk {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: 0 2px 14px rgba(0,0,0,.35);
  padding: 16px 18px;
}
.rate-lbl { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
.rate-row  { display: flex; gap: 8px; }

.btn-rate {
  flex: 1; padding: 10px 4px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--zh); font-size: 13px;
  cursor: pointer; text-align: center;
  transition: border-color .2s, color .2s, box-shadow .2s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.btn-rate:hover { border-color: rgba(139,124,246,0.28); color: var(--text); }
.btn-rate:active { transform: scale(.96); }
.btn-rate.sel {
  background: var(--accent-grad);
  border-color: transparent;
  color: #fff; font-weight: 600;
  box-shadow: 0 0 18px rgba(139,124,246,0.38);
}

/* Comment block */
.comment-blk {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
}
.comment-blk textarea {
  width: 100%;
  min-height: 78px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--zh);
  font-size: 15px;
  line-height: 1.7;
  padding: 10px 12px;
  resize: vertical;
  outline: none;
  margin-top: 8px;
  transition: border-color .2s;
  display: block;
}
.comment-blk textarea:focus { border-color: rgba(139,124,246,0.4); }
.comment-blk textarea::placeholder { color: var(--text-muted); }

.done-banner {
  display: none; margin-top: 14px;
  text-align: center; font-size: 14px;
  color: var(--accent); font-weight: 600;
  background: rgba(139,124,246,0.08);
  border: 1px solid rgba(139,124,246,0.22);
  padding: 12px; border-radius: 8px;
}
.done-banner.vis { display: block; }

/* ══ DEFINITION PANEL ═════════════════════════════════════ */
#def-panel {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 100;
  background: var(--surface-2);
  border-top: 1px solid rgba(139,124,246,0.18);
  box-shadow: 0 -4px 40px rgba(0,0,0,.65);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform .22s cubic-bezier(.34,1.26,.64,1);
}
#def-panel.open { transform: translateY(0); }

.def-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.def-zh {
  font-size: 36px; font-weight: 700; line-height: 1.1;
  color: var(--accent);
  text-shadow: 0 0 22px rgba(139,124,246,0.45);
}
.def-py   { font-size: 16px; color: var(--accent-2); font-family: var(--en); margin-top: 5px; letter-spacing: .02em; }
.def-gl   { font-size: 14px; color: var(--text-muted); font-family: var(--en); margin-top: 2px; }
.def-hint { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 10px; }

.btn-close {
  background: none; border: none;
  font-size: 20px; color: var(--text-muted);
  cursor: pointer; padding: 0 0 0 12px;
  line-height: 1; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.btn-close:hover { color: var(--text); }

/* ══ REVIEW VIEW ══════════════════════════════════════════ */
#rv-view {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  overflow-y: auto;
  z-index: 50;
  -webkit-overflow-scrolling: touch;
}
#rv-view.open { display: block; }

.rv-hdr {
  position: sticky; top: 0; z-index: 5;
  background: rgba(12,13,20,0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.rv-prog-text {
  font-size: 13px; font-weight: 700;
  color: var(--text-muted); font-family: var(--en);
}
.rv-prog-bar {
  position: sticky; top: 41px; z-index: 4;
  height: 3px; background: var(--surface-2);
}
.rv-prog-fill {
  height: 100%;
  background: var(--accent-grad);
  transition: width .35s ease;
}
.rv-body {
  max-width: 580px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}
.rv-format-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; font-family: var(--en);
  color: var(--text-muted); margin-bottom: 18px;
}
.rv-zh-large {
  font-size: 56px; font-weight: 700;
  color: var(--accent); text-align: center;
  text-shadow: 0 0 28px rgba(139,124,246,0.4);
  padding: 20px 0 6px;
}
.rv-zh-py {
  font-size: 16px; color: var(--accent-2);
  font-family: var(--en); text-align: center;
  margin-bottom: 20px; letter-spacing: .02em;
}
.rv-prompt {
  font-size: 18px; line-height: 1.75;
  color: var(--text); margin-bottom: 18px;
}
.rv-cloze-sentence {
  font-size: 19px; line-height: 2;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px; margin-bottom: 18px;
}
.rv-opts { display: flex; flex-direction: column; gap: 10px; }
.rv-opt {
  padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text);
  font-family: var(--zh); font-size: 15px; text-align: left;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.rv-opt:hover:not(:disabled) {
  border-color: rgba(139,124,246,0.3); background: var(--surface-2);
}
.rv-opt.ok {
  border-color: rgba(80,200,120,0.55); background: rgba(80,200,120,0.08);
  color: #6dca87; font-weight: 600;
}
.rv-opt.nok {
  border-color: rgba(255,100,100,0.45); background: rgba(255,100,100,0.07);
  color: #ff8080; font-weight: 600;
}
.rv-opt:disabled { cursor: default; }

/* Matching */
.rv-match-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rv-match-col { display: flex; flex-direction: column; gap: 8px; }
.rv-match-item {
  padding: 12px 10px;
  border: 1.5px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text);
  font-family: var(--zh); font-size: 14px; text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.rv-match-item:hover:not(.matched) { border-color: rgba(139,124,246,0.3); }
.rv-match-item.sel {
  border-color: var(--accent);
  background: rgba(139,124,246,0.12); color: var(--accent);
}
.rv-match-item.matched {
  border-color: rgba(80,200,120,0.5); background: rgba(80,200,120,0.07);
  color: #6dca87; font-weight: 600; cursor: default;
}
.rv-match-item.wrong {
  border-color: rgba(255,100,100,0.5); background: rgba(255,100,100,0.08);
  color: #ff8080;
}

/* Flashcard */
.rv-flashcard {
  background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 16px;
  padding: 40px 20px; text-align: center;
  cursor: pointer; min-height: 190px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 28px rgba(0,0,0,.45);
  transition: border-color .2s;
  -webkit-tap-highlight-color: transparent;
}
.rv-flashcard:hover:not(.flipped) { border-color: rgba(139,124,246,0.28); }
.rv-flashcard.flipped { cursor: default; }
.rv-fc-back { display: none; }
.rv-flashcard.flipped .rv-fc-back { display: block; }
.rv-flashcard.flipped .rv-fc-tap-hint { display: none; }
.rv-fc-tap-hint { font-size: 12px; color: var(--text-muted); font-family: var(--en); margin-top: 10px; }
.rv-fc-py { font-size: 17px; color: var(--accent-2); font-family: var(--en); letter-spacing: .02em; margin-bottom: 6px; }
.rv-fc-meaning { font-size: 16px; color: var(--text); }
.rv-self-btns { display: none; gap: 12px; margin-top: 20px; }
.rv-self-btns.vis { display: flex; }
.rv-btn-gotit {
  flex: 1; padding: 13px;
  background: rgba(80,200,120,0.1); border: 1.5px solid rgba(80,200,120,0.4);
  border-radius: 10px; color: #6dca87;
  font-family: var(--zh); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background .15s;

}
.rv-btn-gotit:hover { background: rgba(80,200,120,0.18); }
.rv-btn-missed {

}
.rv-btn-missed:hover { background: rgba(255,100,100,0.15); }

/* Summary */
.rv-summary { text-align: center; padding: 10px 0 20px; }
.rv-summary-title { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 4px; }

/* Review day card tag */
.tag.review {
  background: rgba(251,191,36,0.1);

</style>

<body>

<!-- ══ WEEK VIEW ═══════════════════════════════════════════ -->
<div id="week-view">
  <div class="wk-hdr">
    <h1 id="wk-title">中文阅读器</h1>
    <span class="pill" id="wk-pill">— / —</span>
  </div>
  <div class="week-picker" id="week-picker">
    <label for="week-select">周</label>
    <div class="week-select-wrap">
      <select class="week-select" id="week-select" aria-label="选择周"></select>
    </div>
  </div>
  <div class="day-list" id="day-list">
    <div class="loading">加载中…</div>
  </div>
  <div class="wk-foot">
    <button class="btn-export" id="btn-export">导出本周反馈</button>
    <button class="btn-copy"   id="btn-copy">复制反馈</button>
  </div>
</div>

<!-- ══ READING VIEW ════════════════════════════════════════ -->
<div id="reading-view">
  <div class="rd-hdr">
    <button class="btn-back" id="btn-back">← 返回</button>
    <div class="rd-tags" id="rd-tags"></div>
  </div>
  <div class="art-wrap">
    <h2 class="art-title" id="art-title"></h2>
    <div class="art-text" id="art-text"></div>
    <div id="comp-sec"></div>
    <div class="rates" id="rates-sec"></div>
    <div class="done-banner" id="done-banner">✓ 本文已完成！</div>
  </div>
</div>

<!-- ══ REVIEW VIEW ════════════════════════════════════════ -->
<div id="rv-view">
  <div class="rv-hdr">
    <button class="btn-back" id="btn-back-rv">← 返回</button>
    <span class="rv-prog-text" id="rv-prog-text"></span>
  </div>
  <div class="rv-prog-bar"><div class="rv-prog-fill" id="rv-prog-fill" style="width:0%"></div></div>
  <div class="rv-body" id="rv-body"></div>
</div>

<!-- ══ DEFINITION PANEL ════════════════════════════════════ -->
<div id="def-panel">
  <div class="def-row">
    <div>
      <div class="def-zh" id="def-zh"></div>
      <div class="def-py" id="def-py"></div>
      <div class="def-gl" id="def-gl"></div>
    </div>
    <button class="btn-close" id="btn-close-def" aria-label="关闭">✕</button>
  </div>
  <div class="def-hint" id="def-hint"></div>
</div>

<script>
(function () {
'use strict';

/* ── constants ──────────────────────────────────────────── */
var TYPE_ZH = { article: '文章', dialogue: '对话', story: '故事', review: '复习' };

/* ── shared state ───────────────────────────────────────── */
var S = {
  week:     1,
  manifest: { weeks: [1], latest: 1 },
  index:    null,
  art:      {},
  curId:    null,
  tokens:   [],
  defOpen:  false,
  review:   null,
};

/* ── localStorage ───────────────────────────────────────── */
function lsKey(id) { return 'cr_w' + S.week + '_' + id; }

function blank() {
  return { unkns: [], diff: null, topic: null, comp: [], done: false, comment: '' };
}

function loadSt(id) {
  try {
    var r = localStorage.getItem(lsKey(id));
    if (!r) return blank();
    var parsed = JSON.parse(r);
    var st = Object.assign(blank(), parsed);
    /* migrate old comp: string → [{correct}] */
    if (typeof st.comp === 'string') {
      st.comp = [{ correct: st.comp === 'got_it' }];
    } else if (!Array.isArray(st.comp)) {
      st.comp = [];
    }
    if (typeof st.comment !== 'string') st.comment = '';
    return st;
  } catch(e) { return blank(); }
}

function saveSt(id, st) {
  try { localStorage.setItem(lsKey(id), JSON.stringify(st)); } catch(e) {}
}

/* ── fetch ──────────────────────────────────────────────── */
function weekDir() {
  return '../weeks/week-' + String(S.week).padStart(2, '0');
}

function jfetch(url) {
  return fetch(url + '?t=' + Date.now()).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + url);
    return r.json();
  });
}

/* ── HTML escape ────────────────────────────────────────── */
function h(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══ INIT ═══════════════════════════════════════════════════ */
function init() {
  var p = new URLSearchParams(location.search);
  var weekParam = p.get('week');

  jfetch('../weeks/manifest.json').then(function(manifest) {
    S.manifest = manifest;
    var requestedWeek = weekParam ? parseInt(weekParam, 10) : null;
    S.week = requestedWeek && (manifest.weeks || []).indexOf(requestedWeek) !== -1
      ? requestedWeek
      : (manifest.latest || 1);
    afterManifest();
  }).catch(function() {
    /* no manifest — fall back to week 1 */
    S.week = weekParam ? Math.max(1, parseInt(weekParam, 10) || 1) : 1;
    afterManifest();
  });
}

function afterManifest() {
  renderWeekPicker();
  document.getElementById('wk-title').textContent = '第 ' + S.week + ' 周';
  loadWeekIndex();
}

/* ══ WEEK PICKER ════════════════════════════════════════════ */
function renderWeekPicker() {
  var select = document.getElementById('week-select');
  select.innerHTML = '';
  (S.manifest.weeks || [1]).forEach(function(w) {
    var option = document.createElement('option');
    option.value = String(w);
    option.textContent = '第 ' + w + ' 周';
    option.selected = w === S.week;
    select.appendChild(option);
  });
  select.onchange = function() {
    var w = parseInt(select.value, 10);
    if (w !== S.week) switchWeek(w);
  };
}

function switchWeek(w) {
  S.week = w;
  S.art  = {};
  S.index = null;
  history.replaceState(null, '', '?week=' + w);
  document.getElementById('wk-title').textContent = '第 ' + w + ' 周';
  document.getElementById('week-select').value = String(w);
  document.getElementById('day-list').innerHTML = '<div class="loading">加载中…</div>';
  loadWeekIndex();
}

function loadWeekIndex() {
  jfetch(weekDir() + '/index.json').then(function(idx) {
    S.index = idx;
    renderWeek();
  }).catch(function(e) {
    document.getElementById('day-list').innerHTML =
      '<div class="err">无法加载第 ' + S.week + ' 周数据。<br><small>' + h(e.message) + '</small></div>';
  });
}

/* ══ WEEK VIEW ══════════════════════════════════════════════ */
function renderWeek() {
  var list = document.getElementById('day-list');
  list.innerHTML = '';
  var done = 0;
  var total = S.index.articles.length;

  S.index.articles.forEach(function(a) {
    var st = loadSt(a.id);
    if (st.done) done++;
    list.appendChild(makeCard(a, st));
  });

  document.getElementById('wk-pill').textContent = done + ' / ' + total;
}

function makeCard(a, st) {
  var card = document.createElement('div');
  card.className = 'day-card' + (st.done ? ' done' : '');

  var typeLabel = TYPE_ZH[a.type] || a.type;
  var doneTag   = st.done ? '<span class="tag done">✓ 完成</span>' : '';
  var isReview  = a.type === 'review';

  var extraTags = isReview ? '' :
    '<span class="tag">' + h(a.topic || '') + '</span>' +
    '<span class="tag lvl">' + h(a.target_level || '') + '</span>';

  card.innerHTML =
    '<div class="day-num">' + a.day + '</div>' +
    '<div class="card-info">' +
      '<div class="card-title">' + h(a.title) + '</div>' +
      '<div class="card-tags">' +
        '<span class="tag' + (isReview ? ' review' : '') + '">' + h(typeLabel) + '</span>' +
        extraTags +
        doneTag +
      '</div>' +
    '</div>' +
    '<div class="done-icon">' + (st.done ? '✓' : '○') + '</div>';

  card.addEventListener('click', function() { openArt(a.id); });
  return card;
}

/* ══ READING VIEW ═══════════════════════════════════════════ */
function openArt(id) {
  var load = S.art[id]
    ? Promise.resolve(S.art[id])
    : jfetch(weekDir() + '/' + id + '.json').then(function(d) {
        S.art[id] = d; return d;
      });

  load.then(function(art) {
    if (art.type === 'review') { openReview(art); return; }
    S.curId  = id;
    S.tokens = art.tokens;

    var st = loadSt(id);

    document.getElementById('week-view').style.display = 'none';
    var rv = document.getElementById('reading-view');
    rv.classList.add('open');
    rv.scrollTop = 0;

    document.getElementById('art-title').textContent = art.title;
    document.getElementById('rd-tags').innerHTML =
      '<span class="tag">' + h(TYPE_ZH[art.type] || art.type) + '</span>' +
      '<span class="tag">' + h(art.topic) + '</span>' +
      '<span class="tag lvl">' + h(art.target_level) + '</span>';

    buildText(art.tokens, st.unkns);
    buildComp(art.comprehension || [], st);
    buildRatings(st);
    document.getElementById('done-banner').classList.toggle('vis', !!st.done);
    closePanel();

  }).catch(function(e) {
    alert('加载失败：' + e.message);
  });
}

/* ── token rendering with ruby ──────────────────────────── */
function buildText(tokens, unknArr) {
  var unkSet = new Set(unknArr);
  var el = document.getElementById('art-text');
  el.innerHTML = '';
  var frag = document.createDocumentFragment();

  tokens.forEach(function(tok, i) {
    if (tok.punct) {
      var s = document.createElement('span');
      s.className   = 'punct';
      s.textContent = tok.t;
      frag.appendChild(s);
      return;
    }

    /* plain token: no py/g and not a name — render as non-tappable text */
    if (!tok.py && !tok.g && !tok.name) {
      var sp = document.createElement('span');
      sp.className   = 'plain';
      sp.textContent = tok.t;
      frag.appendChild(sp);
      return;
    }

    var isName  = !!tok.name;
    var isFirst = !!tok.first;   /* first occurrence of a name → always show pinyin */
    var isUnk   = unkSet.has(i);
    var showPy  = isUnk || isFirst;

    var ruby = document.createElement('ruby');
    var cls = 'word';
    if (isName)  cls += ' word-name';
    if (isUnk)   cls += ' unk';
    if (showPy)  cls += ' py-on';
    ruby.className = cls;
    ruby.dataset.i = i;
    ruby.addEventListener('click', onWordTap);

    ruby.appendChild(document.createTextNode(tok.t));

    var rt = document.createElement('rt');
    rt.textContent = showPy ? (tok.py || '') : '';
    ruby.appendChild(rt);

    frag.appendChild(ruby);
  });

  el.appendChild(frag);
}

function onWordTap() {
  var idx = parseInt(this.dataset.i, 10);
  var tok = S.tokens[idx];

  /* name tokens: show panel only, don't add to unkns */
  if (tok.name) {
    showPanel(tok, false, true);
    return;
  }

  var st  = loadSt(S.curId);
  var unk = new Set(st.unkns);
  var rt  = this.querySelector('rt');

  if (unk.has(idx)) {
    unk.delete(idx);
    this.classList.remove('unk');
    /* only hide pinyin if not a first-occurrence name token */
    if (!tok.first) {
      this.classList.remove('py-on');
      if (rt) rt.textContent = '';
    }
  } else {
    unk.add(idx);
    this.classList.add('unk');
    this.classList.add('py-on');
    if (rt) rt.textContent = tok.py || '';
  }

  st.unkns = Array.from(unk);
  saveSt(S.curId, st);
  showPanel(tok, unk.has(idx), false);
}

/* ── definition panel ───────────────────────────────────── */
function showPanel(tok, isUnk, isName) {
  document.getElementById('def-zh').textContent = tok.t;
  document.getElementById('def-py').textContent = tok.py || '';
  document.getElementById('def-gl').textContent = tok.g  || '';

  var hint = '';
  if (isName) {
    hint = '专有名词';
  } else if (isUnk) {
    hint = '已标记为生词 · 再次点击可取消标记';
  } else {
    hint = '已取消标记 · 点击词语可重新标记';
  }
  document.getElementById('def-hint').textContent = hint;
  document.getElementById('def-panel').classList.add('open');
  S.defOpen = true;
}

function closePanel() {
  document.getElementById('def-panel').classList.remove('open');
  S.defOpen = false;
}

/* ── comprehension ──────────────────────────────────────── */
/*
 * Handles three question shapes:
 *   legacy open:      { q, a }                           — show/hide answer + self-assess
 *   true_false:       { type:"true_false",  q, answer }  — 对/错 buttons
 *   multiple_choice:  { type:"multiple_choice", q, options:[], answer:N }
 */
function buildComp(items, st) {
  var el = document.getElementById('comp-sec');
  el.innerHTML = '';
  if (!items.length) return;

  var block = document.createElement('div');
  block.className = 'comp-block';

  var lbl = document.createElement('div');
  lbl.className = 'blk-lbl';
  lbl.textContent = '理解问题';
  block.appendChild(lbl);

  items.forEach(function(q, qi) {
    var entry    = st.comp && st.comp[qi] != null ? st.comp[qi] : null;
    var answered = entry !== null;
    var type     = q.type || 'open';

    var qDiv = document.createElement('div');
    qDiv.className = 'comp-q';

    var qText = document.createElement('p');
    qText.className = 'q-text';
    qText.textContent = q.q;
    qDiv.appendChild(qText);

    if (type === 'open') {
      buildOpenQ(qDiv, q, qi, answered, entry);
    } else if (type === 'true_false') {
      buildTFQ(qDiv, q, qi, answered, entry);
    } else if (type === 'multiple_choice') {
      buildMCQ(qDiv, q, qi, answered, entry);
    }

    block.appendChild(qDiv);
  });

  el.appendChild(block);
}

function buildOpenQ(qDiv, q, qi, answered, entry) {
  if (!answered) {
    var btnShow = document.createElement('button');
    btnShow.className = 'btn-show';
    btnShow.textContent = '显示答案';
    qDiv.appendChild(btnShow);
  }

  var ansEl = document.createElement('div');
  ansEl.className = 'ans-text' + (answered ? ' vis' : '');
  ansEl.textContent = q.a;
  qDiv.appendChild(ansEl);

  var btnsEl = document.createElement('div');
  btnsEl.className = 'comp-btns' + (answered ? ' vis' : '');

  var gotIt  = makeCompBtn('✓ 答对了', answered && entry && entry.correct  ? 'ok'  : '');
  gotIt.dataset.v = 'true';
  var missed = makeCompBtn('✗ 没答对',  answered && entry && !entry.correct ? 'nok' : '');
  missed.dataset.v = 'false';

  btnsEl.appendChild(gotIt);
  btnsEl.appendChild(missed);
  qDiv.appendChild(btnsEl);

  if (!answered) {
    qDiv.querySelector('.btn-show').addEventListener('click', function() {
      this.style.display = 'none';
      ansEl.classList.add('vis');
      btnsEl.classList.add('vis');
    });
  }

  btnsEl.querySelectorAll('.btn-comp').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (answered) return;
      var isCorrect = this.dataset.v === 'true';
      saveComp(qi, { correct: isCorrect });
      answered = true;
      btnsEl.querySelectorAll('.btn-comp').forEach(function(b) { b.className = 'btn-comp'; });
      this.className = 'btn-comp ' + (isCorrect ? 'ok' : 'nok');
    });
  });
}

function buildTFQ(qDiv, q, qi, answered, entry) {
  var btnsEl = document.createElement('div');
  btnsEl.className = 'comp-btns vis';
  /* answer may be a boolean (true=对, false=错) or already a string */
  var correctAns = q.answer === true ? '对' : q.answer === false ? '错' : q.answer;

  ['对', '错'].forEach(function(opt) {
    var isCorrect = opt === correctAns;
    var cls = '';
    if (answered) {
      if (entry && ((opt === '对') === entry.correct) && isCorrect) cls = 'ok';
      else if (answered && entry && ((opt === '对') !== entry.correct) && !isCorrect) cls = '';
      /* highlight: correct answer = ok; if they chose wrong, chosen = nok, correct = ok */
      var theyChose = entry && entry.selected === opt;
      if (theyChose && entry.correct)  cls = 'ok';
      else if (theyChose && !entry.correct) cls = 'nok';
      else if (isCorrect && answered && !entry.correct) cls = 'ok';
      else cls = '';
    }
    var btn = makeCompBtn(opt, cls);
    if (answered) btn.disabled = true;
    btn.addEventListener('click', function() {
      if (answered) return;
      var correct = (opt === correctAns);
      saveComp(qi, { correct: correct, selected: opt });
      answered = true;
      btnsEl.querySelectorAll('.btn-comp').forEach(function(b) {
        b.disabled = true;
        b.className = 'btn-comp';
      });
      btn.className = 'btn-comp ' + (correct ? 'ok' : 'nok');
      if (!correct) {
        btnsEl.querySelectorAll('.btn-comp').forEach(function(b) {
          if (b.textContent === correctAns) b.className = 'btn-comp ok';
        });
      }
    });
    btnsEl.appendChild(btn);
  });

  qDiv.appendChild(btnsEl);
}

function buildMCQ(qDiv, q, qi, answered, entry) {
  var btnsEl = document.createElement('div');
  btnsEl.className = 'comp-btns vis col';
  /* support both answer_index (new) and answer (legacy) field names */
  var correctIdx = q.answer_index !== undefined ? q.answer_index : q.answer;

  (q.options || []).forEach(function(opt, oi) {
    var isCorrect = oi === correctIdx;
    var cls = '';
    if (answered) {
      var theyChoseThis = entry && entry.selected === oi;
      if (theyChoseThis && entry.correct)  cls = 'ok';
      else if (theyChoseThis && !entry.correct) cls = 'nok';
      else if (isCorrect && answered && entry && !entry.correct) cls = 'ok';
    }
    var btn = makeCompBtn(opt, cls);
    if (answered) btn.disabled = true;
    btn.addEventListener('click', function() {
      if (answered) return;
      var correct = (oi === correctIdx);
      saveComp(qi, { correct: correct, selected: oi });
      answered = true;
      btnsEl.querySelectorAll('.btn-comp').forEach(function(b) {
        b.disabled = true;
        b.className = 'btn-comp';
      });
      btn.className = 'btn-comp ' + (correct ? 'ok' : 'nok');
      if (!correct) {
        btnsEl.querySelectorAll('.btn-comp')[correctIdx].className = 'btn-comp ok';
      }
    });
    btnsEl.appendChild(btn);
  });

  qDiv.appendChild(btnsEl);
}

function makeCompBtn(text, extraCls) {
  var btn = document.createElement('button');
  btn.className = 'btn-comp' + (extraCls ? ' ' + extraCls : '');
  btn.textContent = text;
  return btn;
}

function saveComp(qi, val) {
  var st2 = loadSt(S.curId);
  if (!Array.isArray(st2.comp)) st2.comp = [];
  while (st2.comp.length <= qi) st2.comp.push(null);
  st2.comp[qi] = val;
  saveSt(S.curId, st2);
}

/* ── ratings + comment ──────────────────────────────────── */
function buildRatings(st) {
  var el = document.getElementById('rates-sec');

  el.innerHTML =
    '<div class="rate-blk">' +
      '<div class="rate-lbl">难度</div>' +
      '<div class="rate-row">' +
        rateBtn('diff', 'too_easy',   '太简单', st.diff) +
        rateBtn('diff', 'just_right', '刚刚好', st.diff) +
        rateBtn('diff', 'too_hard',   '太难了', st.diff) +
      '</div>' +
    '</div>' +
    '<div class="rate-blk">' +
      '<div class="rate-lbl">主题</div>' +
      '<div class="rate-row">' +
        rateBtn('topic', 'liked',    '喜欢',  st.topic) +
        rateBtn('topic', 'meh',      '还好',  st.topic) +
        rateBtn('topic', 'disliked', '不喜欢', st.topic) +
      '</div>' +
    '</div>' +
    '<div class="comment-blk">' +
      '<div class="rate-lbl">感想（用中文写，可选）</div>' +
      '<textarea id="art-comment" placeholder="写下你的感想…">' +
        h(st.comment || '') +
      '</textarea>' +
    '</div>';

  el.querySelectorAll('.btn-rate').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var g = this.dataset.g, v = this.dataset.v;
      var st2 = loadSt(S.curId);
      if (g === 'diff') st2.diff = v; else st2.topic = v;
      saveSt(S.curId, st2);
      el.querySelectorAll('.btn-rate[data-g="' + g + '"]').forEach(function(b) {
        b.classList.remove('sel');
      });
      this.classList.add('sel');
      checkDone(st2);
    });
  });

  var ta = document.getElementById('art-comment');
  ta.addEventListener('input', function() {
    var st2 = loadSt(S.curId);
    st2.comment = this.value;
    saveSt(S.curId, st2);
  });
}

function rateBtn(group, val, label, current) {
  return '<button class="btn-rate' + (current === val ? ' sel' : '') +
    '" data-g="' + group + '" data-v="' + val + '">' + label + '</button>';
}

function checkDone(st) {
  if (st.diff && st.topic && !st.done) {
    st.done = true;
    saveSt(S.curId, st);
    document.getElementById('done-banner').classList.add('vis');
  }
}

/* ── navigation ─────────────────────────────────────────── */
function goBack() {
  closePanel();
  document.getElementById('reading-view').classList.remove('open');
  document.getElementById('week-view').style.display = '';
  S.curId = null;
  renderWeek();
  window.scrollTo(0, 0);
}

/* ══ EXPORT / COPY ══════════════════════════════════════════ */
function buildExportData() {
  var allEntries  = S.index.articles;
  var readingArts = allEntries.filter(function(a) { return a.type !== 'review'; });
  var reviewEntry = null;
  for (var ri = 0; ri < allEntries.length; ri++) {
    if (allEntries[ri].type === 'review') { reviewEntry = allEntries[ri]; break; }
  }

  var loads = readingArts.map(function(a) {
    if (S.art[a.id]) return Promise.resolve(S.art[a.id]);
    return jfetch(weekDir() + '/' + a.id + '.json').then(function(d) {
      S.art[a.id] = d; return d;
    }).catch(function() { return null; });
  });

  return Promise.all(loads).then(function(artDatas) {
    var articles = readingArts.map(function(a, i) {
      var artData     = artDatas[i];
      var st          = loadSt(a.id);
      var tappable    = artData
        ? artData.tokens.filter(function(t) { return !t.punct && !t.name && (t.py || t.g); }).length : 0;

      var wordsTapped = [];
      if (artData) {
        st.unkns.forEach(function(idx) {
          var tok = artData.tokens[idx];
          if (tok && !tok.punct) wordsTapped.push({ t: tok.t, py: tok.py || '', g: tok.g || '' });
        });
      }

      var compItems = (artData && artData.comprehension) ? artData.comprehension : [];
      var comprehension = compItems.map(function(q, qi) {
        var entry = st.comp && st.comp[qi] != null ? st.comp[qi] : null;
        return {
          type:    q.type || 'open',
          correct: entry !== null ? !!entry.correct : null,
        };
      });

      return {
        id:               a.id,
        topic:            a.topic,
        register:         a.register,
        type:             a.type,
        target_level:     a.target_level,
        completed:        !!st.done,
        difficulty_rating: st.diff  || null,
        topic_rating:      st.topic || null,
        comprehension:     comprehension,
        comment:           st.comment || '',
        words_tapped:      wordsTapped,
        unknown_rate:      tappable > 0
          ? parseFloat((st.unkns.length / tappable).toFixed(4)) : 0,
      };
    });

    var blob = { week: S.week, exported_at: new Date().toISOString(), articles: articles };

    if (reviewEntry) {
      var rv_raw;
      try { rv_raw = localStorage.getItem(lsKey(reviewEntry.id)); } catch(e) { rv_raw = null; }
      var rv_st = rv_raw ? JSON.parse(rv_raw) : { results: [] };
      var review_results = [];
      (rv_st.results || []).forEach(function(r) {
        if (r.format === 'matching') {
          (r.pairs || []).forEach(function(p) {
            review_results.push({ word: p.t, format: 'matching', correct: true });
          });
        } else if (r.format === 'flashcard_selfrate') {
          review_results.push({ word: r.word, format: r.format, self_rating: r.self_rating });
        } else {
          review_results.push({ word: r.word, format: r.format, correct: r.correct });
        }
      });
      blob.review_results = review_results;
    }

    return blob;
  });
}

function doExport() {
  buildExportData().then(function(blob) {
    var url = URL.createObjectURL(
      new Blob([JSON.stringify(blob, null, 2)], { type: 'application/json' })
    );
    var a = document.createElement('a');
    a.href = url;
    a.download = 'week-' + S.week + '-feedback.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  });
}

function doCopy() {
  buildExportData().then(function(blob) {
    var text = JSON.stringify(blob, null, 2);
    var btn  = document.getElementById('btn-copy');

    function flash() {
      btn.textContent = '✓ 已复制';
      setTimeout(function() { btn.textContent = '复制反馈'; }, 2200);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-9999px;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash(); } catch(e) {}
      document.body.removeChild(ta);
    }
  });
}

/* ══ REVIEW ══════════════════════════════════════════════════ */

function mkEl(tag, cls, text) {
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

function loadRevSt() {
  try {
    var r = localStorage.getItem(lsKey(S.review.id));
    if (!r) return { cur: 0, results: [], done: false };
    return Object.assign({ cur: 0, results: [], done: false }, JSON.parse(r));
  } catch(e) { return { cur: 0, results: [], done: false }; }
}
function saveRevSt(st) {
  try { localStorage.setItem(lsKey(S.review.id), JSON.stringify(st)); } catch(e) {}
}

function openReview(art) {
  S.review = { id: art.id, data: art };
  var rv_st = loadRevSt();
  document.getElementById('week-view').style.display = 'none';
  var rv = document.getElementById('rv-view');
  rv.classList.add('open');
  rv.scrollTop = 0;
  if (rv_st.done) {
    renderReviewSummary(rv_st.results);
  } else {
    renderReviewCard(rv_st.cur);
  }
}

function goBackFromReview() {
  document.getElementById('rv-view').classList.remove('open');
  document.getElementById('week-view').style.display = '';
  S.review = null;
  renderWeek();
  window.scrollTo(0, 0);
}

function advanceReview(result) {
  var rv_st = loadRevSt();
  rv_st.results.push(result);
  rv_st.cur++;
  if (rv_st.cur >= S.review.data.items.length) rv_st.done = true;
  saveRevSt(rv_st);
  document.getElementById('rv-view').scrollTop = 0;
  if (rv_st.done) {
    renderReviewSummary(rv_st.results);
  } else {
    renderReviewCard(rv_st.cur);
  }
}

function renderReviewCard(idx) {
  var items = S.review.data.items;
  var total = items.length;
  var item  = items[idx];
  document.getElementById('rv-prog-text').textContent = (idx + 1) + ' / ' + total;
  document.getElementById('rv-prog-fill').style.width = (idx / total * 100).toFixed(1) + '%';
  var body = document.getElementById('rv-body');
  body.innerHTML = '';
  var fmt = item.format;
  if      (fmt === 'matching')           renderMatchingCard(body, item);
  else if (fmt === 'recognition_mc')     renderMCCard(body, item);
  else if (fmt === 'reverse_recall_mc')  renderMCCard(body, item);
  else if (fmt === 'cloze')              renderClozeCard(body, item);
  else if (fmt === 'flashcard_selfrate') renderFlashcardCard(body, item);
}

function renderMCCard(body, item) {
  var fmt = item.format;
  var lbl = fmt === 'recognition_mc' ? '选义 · MEANING' : '选词 · RECALL';
  body.appendChild(mkEl('div', 'rv-format-lbl', lbl));

  var pyEl = null;
  if (fmt === 'recognition_mc') {
    body.appendChild(mkEl('div', 'rv-zh-large', item.word.t));
    pyEl = mkEl('div', 'rv-zh-py', item.word.py || '');
    pyEl.style.visibility = 'hidden';
    body.appendChild(pyEl);
  }

  body.appendChild(mkEl('p', 'rv-prompt', item.prompt));

  var optsEl = mkEl('div', 'rv-opts');
  var answered = false;
  item.options.forEach(function(opt, oi) {
    var btn = mkEl('button', 'rv-opt', opt);
    btn.addEventListener('click', function() {
      if (answered) return;
      answered = true;
      var correct = oi === item.answer_index;
      optsEl.querySelectorAll('.rv-opt').forEach(function(b) { b.disabled = true; });
      btn.className = 'rv-opt ' + (correct ? 'ok' : 'nok');
      if (!correct) optsEl.querySelectorAll('.rv-opt')[item.answer_index].className = 'rv-opt ok';
      if (fmt === 'recognition_mc' && pyEl) pyEl.style.visibility = '';
      setTimeout(function() {
        advanceReview({ format: fmt, word: item.word.t, correct: correct });
      }, 950);
    });
    optsEl.appendChild(btn);
  });
  body.appendChild(optsEl);
}

function renderClozeCard(body, item) {
  body.appendChild(mkEl('div', 'rv-format-lbl', '填空 · FILL-IN'));
  body.appendChild(mkEl('div', 'rv-cloze-sentence', item.sentence));
  var optsEl = mkEl('div', 'rv-opts');
  var answered = false;
  item.options.forEach(function(opt, oi) {
    var btn = mkEl('button', 'rv-opt', opt);
    btn.addEventListener('click', function() {
      if (answered) return;
      answered = true;
      var correct = oi === item.answer_index;
      optsEl.querySelectorAll('.rv-opt').forEach(function(b) { b.disabled = true; });
      btn.className = 'rv-opt ' + (correct ? 'ok' : 'nok');
      if (!correct) optsEl.querySelectorAll('.rv-opt')[item.answer_index].className = 'rv-opt ok';
      setTimeout(function() {
        advanceReview({ format: 'cloze', word: item.word.t, correct: correct });
      }, 950);
    });
    optsEl.appendChild(btn);
  });
  body.appendChild(optsEl);
}

function renderMatchingCard(body, item) {
  var pairs    = item.pairs;
  var N        = pairs.length;
  var leftOrd  = shuffle(range(N));
  var rightOrd = shuffle(range(N));
  var leftSel  = null;
  var rightSel = null;
  var matched  = new Array(N).fill(false);
  var matchedCount = 0;

  body.appendChild(mkEl('div', 'rv-format-lbl', '配对 · MATCHING'));

  var cols     = mkEl('div', 'rv-match-cols');
  var leftCol  = mkEl('div', 'rv-match-col');
  var rightCol = mkEl('div', 'rv-match-col');
  var leftEls  = new Array(N);
  var rightEls = new Array(N);

  leftOrd.forEach(function(pi, pos) {
    var el = mkEl('div', 'rv-match-item', pairs[pi].t);
    el.addEventListener('click', function() {
      if (matched[pi]) return;
      if (leftSel === pi) {
        el.classList.remove('sel'); leftSel = null; return;
      }
      if (leftSel !== null) leftEls[leftOrd.indexOf(leftSel)].classList.remove('sel');
      leftSel = pi; el.classList.add('sel');
      tryMatch();
    });
    leftEls[pos] = el;
    leftCol.appendChild(el);
  });

  rightOrd.forEach(function(pi, pos) {
    var el = mkEl('div', 'rv-match-item', pairs[pi].g);
    el.addEventListener('click', function() {
      if (matched[pi]) return;
      if (rightSel === pi) {
        el.classList.remove('sel'); rightSel = null; return;
      }
      if (rightSel !== null) rightEls[rightOrd.indexOf(rightSel)].classList.remove('sel');
      rightSel = pi; el.classList.add('sel');
      tryMatch();
    });
    rightEls[pos] = el;
    rightCol.appendChild(el);
  });

  function tryMatch() {
    if (leftSel === null || rightSel === null) return;
    if (leftSel === rightSel) {
      matched[leftSel] = true; matchedCount++;
      var lE = leftEls[leftOrd.indexOf(leftSel)];
      var rE = rightEls[rightOrd.indexOf(rightSel)];
      lE.classList.remove('sel'); lE.classList.add('matched');
      rE.classList.remove('sel'); rE.classList.add('matched');
      leftSel = null; rightSel = null;
      if (matchedCount === N) {
        setTimeout(function() {
          advanceReview({ format: 'matching', pairs: pairs, correct: true });
        }, 700);
      }
    } else {
      var lE2 = leftEls[leftOrd.indexOf(leftSel)];
      var rE2 = rightEls[rightOrd.indexOf(rightSel)];
      lE2.classList.add('wrong'); rE2.classList.add('wrong');
      var ls = leftSel, rs = rightSel;
      leftSel = null; rightSel = null;
      setTimeout(function() {
        leftEls[leftOrd.indexOf(ls)].classList.remove('wrong', 'sel');
        rightEls[rightOrd.indexOf(rs)].classList.remove('wrong', 'sel');
      }, 600);
    }
  }

  cols.appendChild(leftCol); cols.appendChild(rightCol);
  body.appendChild(cols);
}

function renderFlashcardCard(body, item) {
  body.appendChild(mkEl('div', 'rv-format-lbl', '闪卡 · FLASHCARD'));

  var card = mkEl('div', 'rv-flashcard');
  card.appendChild(mkEl('div', 'rv-zh-large', item.prompt));

  var backEl = mkEl('div', 'rv-fc-back');
  backEl.appendChild(mkEl('div', 'rv-fc-py', (item.word && item.word.py) || ''));
  backEl.appendChild(mkEl('div', 'rv-fc-meaning', item.back || ''));
  card.appendChild(backEl);
  card.appendChild(mkEl('div', 'rv-fc-tap-hint', 'tap to reveal'));
  body.appendChild(card);

  var selfBtns = mkEl('div', 'rv-self-btns');
  var gotItBtn = mkEl('button', 'rv-btn-gotit', '✓ 记住了');
  var missedBtn = mkEl('button', 'rv-btn-missed', '✗ 没记住');
  selfBtns.appendChild(gotItBtn); selfBtns.appendChild(missedBtn);
  body.appendChild(selfBtns);

  card.addEventListener('click', function() {
    if (card.classList.contains('flipped')) return;
    card.classList.add('flipped');
    selfBtns.classList.add('vis');
  });

  function onRate(rating) {
    gotItBtn.disabled = true; missedBtn.disabled = true;
    gotItBtn.style.opacity  = rating === 'got_it' ? '1' : '0.35';
    missedBtn.style.opacity = rating === 'missed'  ? '1' : '0.35';
    setTimeout(function() {
      advanceReview({ format: 'flashcard_selfrate',
        word: item.word ? item.word.t : item.prompt, self_rating: rating });
    }, 700);
  }
  gotItBtn.addEventListener('click', function() { onRate('got_it'); });
  missedBtn.addEventListener('click', function() { onRate('missed'); });
}

function renderReviewSummary(results) {
  var items = S.review.data.items;

  /* score: 1 per item (matching = 1 item, always correct) */
  var correct = 0;
  results.forEach(function(r) {
    if (r.format === 'matching') { correct++; }
    else if (r.format === 'flashcard_selfrate') { if (r.self_rating === 'got_it') correct++; }
    else if (r.correct) correct++;
  });
  var total = results.length;

  /* word list for display */
  var wordList = [];
  results.forEach(function(r) {
    if (r.format === 'matching') {
      (r.pairs || []).forEach(function(p) {
        wordList.push({ t: p.t, py: p.py || '', g: p.g || '', ok: true });
      });
    } else {
      var item = null;
      for (var i = 0; i < items.length; i++) {
        if (items[i].word && items[i].word.t === r.word) { item = items[i]; break; }
      }
      var ok = r.format === 'flashcard_selfrate' ? r.self_rating === 'got_it' : !!r.correct;
      wordList.push({
        t:  r.word,
        py: item ? item.word.py : '',
        g:  item ? item.word.g  : '',
        ok: ok
      });
    }
  });

  document.getElementById('rv-prog-text').textContent = '完成';
  document.getElementById('rv-prog-fill').style.width = '100%';

  var body = document.getElementById('rv-body');
  body.innerHTML = '';

  var sum = mkEl('div', 'rv-summary');
  sum.appendChild(mkEl('div', 'rv-summary-title', '复习完成'));
  sum.appendChild(mkEl('div', 'rv-summary-score', correct + ' / ' + total));
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  sum.appendChild(mkEl('div', 'rv-summary-sub', pct + '% correct this session'));

  var list = mkEl('div', 'rv-summary-list');
  wordList.forEach(function(w) {
    var row = mkEl('div', 'rv-si');
    row.appendChild(mkEl('span', 'rv-si-icon', w.ok ? '✓' : '✗'));
    row.appendChild(mkEl('span', 'rv-si-zh', w.t));
    row.appendChild(mkEl('span', 'rv-si-py', w.py));
    row.appendChild(mkEl('span', 'rv-si-g', w.g));
    list.appendChild(row);
  });
  sum.appendChild(list);
  body.appendChild(sum);
}

/* ── wire up events ─────────────────────────────────────── */
document.getElementById('btn-back').addEventListener('click', goBack);
document.getElementById('btn-back-rv').addEventListener('click', goBackFromReview);
document.getElementById('btn-close-def').addEventListener('click', closePanel);
document.getElementById('btn-export').addEventListener('click', doExport);
document.getElementById('btn-copy').addEventListener('click', doCopy);

document.getElementById('reading-view').addEventListener('scroll', function() {
  if (S.defOpen) closePanel();
}, { passive: true });

document.getElementById('art-text').addEventListener('click', function(e) {
  if (e.target === this && S.defOpen) closePanel();
});

init();
}());
